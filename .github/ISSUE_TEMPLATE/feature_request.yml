name: Feature request
description: An idea for Claude cost guard
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How should it work?
    validations:
      required: true
  - type: dropdown
    id: tokens
    attributes:
      label: Token cost
      description: Would it put anything new in front of Claude? Every user pays for that.
      options:
        - "No: it runs outside the model"
        - "Only when the user asks for it"
        - "A few tokens per session"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
